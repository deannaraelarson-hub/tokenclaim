<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multichain Wallet Scanner</title>
    <style>
        :root {
            --primary: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --background: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-secondary: #94a3b8;
            --border: #334155;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--background);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #fff, #e2e8f0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .subtitle {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 20px;
        }
        
        .control-panel {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 30px;
            border: 1px solid var(--border);
        }
        
        .button-group {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        #connectBtn {
            background: var(--primary);
            color: white;
            flex: 1;
            justify-content: center;
        }
        
        #disconnectBtn {
            background: var(--danger);
            color: white;
            display: none;
        }
        
        #scanBtn {
            background: var(--success);
            color: white;
            flex: 1;
            justify-content: center;
        }
        
        .retry-btn {
            background: var(--warning);
            color: white;
            padding: 8px 16px;
            font-size: 14px;
            margin-top: 10px;
        }
        
        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
        }
        
        #status {
            padding: 16px;
            border-radius: 12px;
            margin-top: 20px;
            font-size: 14px;
        }
        
        .status-message {
            background: rgba(16, 185, 129, 0.1);
            border-left: 4px solid var(--success);
            color: var(--success);
        }
        
        .status-error {
            background: rgba(239, 68, 68, 0.1);
            border-left: 4px solid var(--danger);
            color: var(--danger);
        }
        
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
            margin-bottom: 30px;
        }
        
        .info-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid var(--border);
        }
        
        .info-card h3 {
            margin-bottom: 20px;
            color: var(--text);
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .detail-row {
            display: flex;
            justify-content: space-between;
            margin: 12px 0;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
        }
        
        .detail-row:last-child {
            border-bottom: none;
        }
        
        .label {
            color: var(--text-secondary);
            font-weight: 500;
        }
        
        .value {
            color: var(--text);
            font-weight: 600;
        }
        
        .address, .network {
            font-family: monospace;
            font-size: 14px;
        }
        
        .chains-grid, .tokens-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
            margin-top: 16px;
        }
        
        .chain-card, .token-card {
            background: rgba(30, 41, 59, 0.8);
            border-radius: 12px;
            padding: 16px;
            border: 2px solid var(--border);
            transition: all 0.3s ease;
        }
        
        .chain-card:hover, .token-card:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
        }
        
        .chain-card.active {
            border-color: var(--success);
            background: rgba(16, 185, 129, 0.1);
        }
        
        .chain-name {
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        .chain-type, .chain-status, .token-badge {
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 20px;
            display: inline-block;
        }
        
        .chain-type.evm {
            background: rgba(59, 130, 246, 0.2);
            color: var(--primary);
        }
        
        .chain-type.non-evm {
            background: rgba(245, 158, 11, 0.2);
            color: var(--warning);
        }
        
        .chain-status {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
            margin-top: 8px;
        }
        
        .token-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        
        .token-symbol {
            font-weight: bold;
            font-size: 18px;
        }
        
        .token-badge {
            font-size: 10px;
        }
        
        .token-badge.native {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
        }
        
        .token-badge.erc20 {
            background: rgba(59, 130, 246, 0.2);
            color: var(--primary);
        }
        
        .token-name {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }
        
        .token-balance {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        
        .token-address {
            font-family: monospace;
            font-size: 11px;
            color: var(--text-secondary);
            word-break: break-all;
        }
        
        .empty-state {
            text-align: center;
            color: var(--text-secondary);
            padding: 40px 20px;
            font-style: italic;
        }
        
        .scanning-indicator {
            text-align: center;
            padding: 40px;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .error-message {
            text-align: center;
            padding: 30px;
            color: var(--danger);
        }
        
        .no-tokens {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }
        
        .hint {
            font-size: 14px;
            margin-top: 10px;
            opacity: 0.8;
        }
        
        .tokens-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .total-value {
            background: var(--primary);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
        }
        
        .chain-select-container {
            margin-top: 20px;
        }
        
        select {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            background: var(--card-bg);
            border: 2px solid var(--border);
            color: var(--text);
            font-size: 16px;
            margin-top: 8px;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }
            
            header {
                padding: 20px;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .button-group {
                flex-direction: column;
            }
            
            button {
                width: 100%;
            }
            
            .info-grid {
                grid-template-columns: 1fr;
            }
            
            .chains-grid, .tokens-list {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🌐 Multichain Wallet Scanner</h1>
            <p class="subtitle">Connect your wallet to scan tokens across multiple blockchain networks</p>
        </header>
        
        <div class="control-panel">
            <div class="button-group">
                <button id="connectBtn">🔗 Connect Wallet</button>
                <button id="disconnectBtn">❌ Disconnect</button>
                <button id="scanBtn" disabled>🔍 Scan Tokens</button>
            </div>
            
            <div class="chain-select-container">
                <label for="chainSelect">Switch Network:</label>
                <select id="chainSelect">
                    <option value="">Select a network...</option>
                </select>
            </div>
            
            <div id="status" class="status-message">Ready to connect...</div>
        </div>
        
        <div class="info-grid">
            <div class="info-card">
                <h3>👛 Wallet Status</h3>
                <div id="walletInfo">
                    <p class="empty-state">No wallet connected</p>
                </div>
            </div>
            
            <div class="info-card">
                <h3>🌐 Supported Networks</h3>
                <div id="chainsInfo">
                    <p class="empty-state">Connect wallet to see networks</p>
                </div>
            </div>
        </div>
        
        <div class="info-card">
            <h3>💰 Token Scanner</h3>
            <div id="scanResults">
                <p class="empty-state">Scan results will appear here</p>
            </div>
        </div>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
