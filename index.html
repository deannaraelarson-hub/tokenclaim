<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multichain Wallet Scanner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        
        header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        h1 {
            color: white;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }
        
        .subtitle {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1.2rem;
        }
        
        .control-panel {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .button-group {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        #connectBtn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        #scanBtn {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        #status {
            background: rgba(255, 255, 255, 0.9);
            padding: 15px;
            border-radius: 10px;
            font-size: 14px;
            color: #333;
            margin-top: 20px;
            border-left: 4px solid #667eea;
        }
        
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }
        
        .info-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .info-card h3 {
            color: #333;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }
        
        .wallet-info-card p, .chains-list p {
            margin: 8px 0;
            color: #555;
        }
        
        .chains-grid, .tokens-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
            margin-top: 15px;
            max-height: 300px;
            overflow-y: auto;
            padding: 5px;
        }
        
        .chain-card, .token-card {
            background: white;
            border-radius: 10px;
            padding: 12px;
            border: 2px solid #e0e0e0;
            transition: all 0.3s ease;
        }
        
        .chain-card:hover, .token-card:hover {
            transform: translateY(-2px);
            border-color: #667eea;
            box-shadow: 0 4px 8px rgba(102, 126, 234, 0.2);
        }
        
        .chain-card.active {
            border-color: #4CAF50;
            background: rgba(76, 175, 80, 0.1);
        }
        
        .chain-name {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }
        
        .chain-type {
            font-size: 12px;
            color: #666;
            background: #f0f0f0;
            padding: 2px 6px;
            border-radius: 10px;
        }
        
        .evm .chain-type {
            background: #e3f2fd;
            color: #1976d2;
        }
        
        .cosmos .chain-type {
            background: #f3e5f5;
            color: #7b1fa2;
        }
        
        .solana .chain-type {
            background: #fff3e0;
            color: #ff9800;
        }
        
        .loading, .error, .no-tokens {
            text-align: center;
            padding: 40px;
            color: #666;
            font-size: 18px;
        }
        
        .error {
            color: #f44336;
        }
        
        .token-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .token-symbol {
            font-weight: bold;
            font-size: 18px;
            color: #333;
        }
        
        .token-type {
            font-size: 11px;
            background: #e0e0e0;
            padding: 2px 8px;
            border-radius: 10px;
            color: #666;
        }
        
        .native .token-type {
            background: #c8e6c9;
            color: #2e7d32;
        }
        
        .erc20 .token-type {
            background: #bbdefb;
            color: #1565c0;
        }
        
        .token-info p {
            margin: 4px 0;
            font-size: 13px;
            color: #666;
        }
        
        .token-address {
            font-family: monospace;
            font-size: 11px;
            color: #999;
            word-break: break-all;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }
            
            .chains-grid, .tokens-grid {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            }
            
            .button-group {
                flex-direction: column;
            }
            
            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🌐 Multichain Wallet Scanner</h1>
            <p class="subtitle">Connect your wallet to scan tokens across all supported networks</p>
        </header>
        
        <div class="control-panel">
            <div class="button-group">
                <button id="connectBtn">Connect Wallet</button>
                <button id="scanBtn" style="display: none;">Scan All Tokens</button>
            </div>
            <div id="status">Ready to connect...</div>
        </div>
        
        <div class="info-grid">
            <div class="info-card">
                <h3>Wallet Status</h3>
                <div id="walletInfo">
                    <p>Not connected</p>
                </div>
            </div>
            
            <div class="info-card">
                <h3>Supported Networks</h3>
                <div id="chainsInfo">
                    <p>Connect wallet to see supported chains</p>
                </div>
            </div>
        </div>
        
        <div class="info-card">
            <h3>Token Scanner Results</h3>
            <div id="scanResults">
                <p>Scan results will appear here</p>
            </div>
        </div>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
